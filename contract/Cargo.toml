[package]
name = "intentrail-vault"
version = "0.1.0"
edition = "2021"
description = "IntentRail GuardVault: an on-chain seatbelt for AI trading agents on NEAR"
license = "MIT"
repository = "https://github.com/Onegeex/intentrail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
